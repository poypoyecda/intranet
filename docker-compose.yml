version: '3.8'

services:
  # Service PHP/Apache
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: intranet-web
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - .:/var/www/html
    environment:
      MYSQL_HOST: db
      MYSQL_PORT: 3306
      MYSQL_USER: intranet_user
      MYSQL_PASSWORD: intranet_pass
      MYSQL_DATABASE: intranet_db
    depends_on:
      db:
        condition: service_healthy
    networks:
      - intranet-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Service MySQL/MariaDB
  db:
    image: mysql:8.0
    container_name: intranet-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_intranet_123
      MYSQL_DATABASE: intranet_db
      MYSQL_USER: intranet_user
      MYSQL_PASSWORD: intranet_pass
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "3306:3306"
    networks:
      - intranet-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: --default-authentication-plugin=mysql_native_password

  # Service phpMyAdmin
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: intranet-phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_USER: intranet_user
      PMA_PASSWORD: intranet_pass
      PMA_ABSOLUTE_URI: http://localhost:8081/
    ports:
      - "8081:80"
    depends_on:
      - db
    networks:
      - intranet-net

volumes:
  db_data:
    driver: local

networks:
  intranet-net:
    driver: bridge